stages:
  - test
  - release

variables:
  MICROFRONTEND_SLUG: "%serviceSlug%"
  # Base URL of your orchestrator console. Set a project CI/CD variable of the
  # same name to register versions on a different installation.
  MICROFRONTEND_ORCHESTRATOR_DOMAIN: "%domain%"

test:
  stage: test
  image: node:24
  before_script:
    # pnpm comes from the packageManager field of package.json
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm test
    - pnpm build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

release:
  stage: release
  image: docker:29
  services:
    - docker:29-dind
  needs: [test]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
    - |
      curl --fail-with-body --show-error --silent -X POST \
        -H "api-key: ${MICROFRONTEND_ORCHESTRATOR_API_KEY}" \
        -H "Content-Type: application/json" \
        -d "{\"image\":\"${IMAGE}\",\"digest\":\"${DIGEST}\",\"commitSha\":\"${CI_COMMIT_SHA}\"}" \
        "${MICROFRONTEND_ORCHESTRATOR_DOMAIN%/}/api/services/by-slug/${MICROFRONTEND_SLUG}/versions/${CI_COMMIT_TAG}"
    - echo "registered ${MICROFRONTEND_SLUG} ${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
