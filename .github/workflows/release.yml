name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      MFE_DOMAIN: ${{ vars.MICROFRONTEND_ORCHESTRATOR_DOMAIN || '%domain%' }}
      MFE_SERVICE_SLUG: '%serviceSlug%'
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Register version in MFE Orchestrator
        env:
          MFE_API_KEY: ${{ secrets.FLIGHTROOM_API_KEY }}
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            -H "api-key: ${MFE_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"${IMAGE}:${VERSION}\",\"digest\":\"${DIGEST}\",\"commitSha\":\"${GITHUB_SHA}\"}" \
            "${MFE_DOMAIN%/}/api/backends/by-slug/${MFE_SERVICE_SLUG}/versions/${VERSION}"
